services:
  postgres:
    image: postgres:16-alpine
    container_name: kominfo-pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: db_kominfo_test
    ports:
      - "5433:5432"
    volumes:
      - ./pkg/database/migration/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d db_kominfo_test"]
      interval: 3s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: db_kominfo_test
      DB_USERNAME: app
      DB_PASSWORD: app
      DB_TIMEZONE: Asia/Jakarta
      JWT_SECRET: local-dev-secret
      JWT_EXPIRATION: 3600
      JWT_EXPIRATION_REFRESH: 86400
    depends_on:
      postgres:
        condition: service_healthy
