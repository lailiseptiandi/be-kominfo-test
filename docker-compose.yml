services:
  postgres:
    image: postgres:16-alpine
    container_name: kominfo-pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: db_kominfo_test
    ports:
      - "5433:5432"
    volumes:
      - ./pkg/database/migration/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d payments"]
      interval: 3s
      timeout: 3s
      retries: 10
